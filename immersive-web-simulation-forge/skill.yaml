schema: hadara.skill/v0.1
name: immersive-web-simulation-forge
version: 0.6.0
description: >-
  Design, implement, validate, harden, and lean-package concentrated browser
  worlds, physics laboratories, parametric design studios, data instruments,
  operations panels, and other high-fidelity interactive graphical products.
entry:
  skill: SKILL.md
runtime:
  tools:
    forge:
      command: [python, scripts/forge.py]
      description: Initialize, audit, package, and verify interactive world, laboratory, authoring, data, and operations projects.
    check-html:
      command: [node, scripts/check_html.mjs]
      description: Syntax-check HTML scripts and detect JavaScript/GLSL boundary mistakes.
    browser-verify:
      command: [node, scripts/browser_verify.mjs]
      description: Execute capture, smoke, pointer-direction, and external wall-clock performance checks in Chromium.
    fidelity-audit:
      command: [node, scripts/fidelity_audit.mjs]
      description: Detect low-resolution upscale, false area claims, clamped FPS telemetry, placeholder icons, lifecycle gaps, and input-direction risks.
dependencies:
  python: '>=3.10'
  node: '>=20'
  optional:
    - playwright
    - pillow
resources:
  templates: templates/
  references: references/
  kits: kits/
permissions:
  filesystem:
    read:
      - skill_root/**
      - project_root/**
    write:
      - project_root/**
      - .forge/**
  network:
    mode: project-declared
  commands:
    allow:
      - python
      - node
      - npm
      - npx
      - zip
    approval_required:
      - npm install
      - npx playwright install
lifecycle:
  install:
    command: [python, scripts/forge.py, doctor]
    idempotent: true
  verify:
    command: [python, scripts/forge.py, doctor]
  update:
    strategy: replace-preserve-user-projects
  uninstall:
    strategy: remove-skill-folder-only
compatibility:
  agents:
    - Claude Code
    - Codex CLI
    - Hermes Agent
    - HADARA-compatible runtimes
  os:
    - windows
    - linux
    - macos
