<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc" focusable="false" shape-rendering="geometricPrecision">
  <title id="title">Immersive Web Simulation Forge icon</title>
  <desc id="desc">A compact terrain mark with a luminous central channel and a calibrated signal sigil.</desc>

  <defs>
    <linearGradient id="bg" x1="60" y1="44" x2="456" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1736"/>
      <stop offset="0.58" stop-color="#06122d"/>
      <stop offset="1" stop-color="#020713"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="44%" r="58%">
      <stop stop-color="#0d3e76" stop-opacity="0.30"/>
      <stop offset="0.68" stop-color="#0b1c48" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="terrain" x1="150" y1="202" x2="360" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8de63"/>
      <stop offset="0.30" stop-color="#56ab6d"/>
      <stop offset="0.72" stop-color="#1a7f87"/>
      <stop offset="1" stop-color="#0d5679"/>
    </linearGradient>
    <linearGradient id="leftRock" x1="136" y1="228" x2="260" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#385779"/>
      <stop offset="0.44" stop-color="#18315d"/>
      <stop offset="1" stop-color="#07162c"/>
    </linearGradient>
    <linearGradient id="rightRock" x1="370" y1="220" x2="254" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22407a"/>
      <stop offset="0.44" stop-color="#0b2762"/>
      <stop offset="1" stop-color="#071328"/>
    </linearGradient>
    <linearGradient id="river" x1="292" y1="176" x2="258" y2="307" gradientUnits="userSpaceOnUse">
      <stop stop-color="#90ffff"/>
      <stop offset="0.36" stop-color="#2be7ff"/>
      <stop offset="1" stop-color="#0b95ff"/>
    </linearGradient>
    <linearGradient id="riverShadow" x1="292" y1="176" x2="258" y2="307" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f78a0"/>
      <stop offset="1" stop-color="#094b84"/>
    </linearGradient>
    <linearGradient id="mountainLight" x1="224" y1="118" x2="306" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f3df"/>
      <stop offset="0.34" stop-color="#99daea"/>
      <stop offset="1" stop-color="#1c78c8"/>
    </linearGradient>
    <linearGradient id="mountainDark" x1="279" y1="128" x2="314" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00c8ff"/>
      <stop offset="0.45" stop-color="#085ba8"/>
      <stop offset="1" stop-color="#082a63"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop stop-color="#ecffff"/>
      <stop offset="0.24" stop-color="#7ef8ff"/>
      <stop offset="0.66" stop-color="#159dff" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#1754ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000713" flood-opacity="0.72"/>
    </filter>
    <clipPath id="terrainClip">
      <path d="M132 223 206 181 254 139 300 165 382 211 341 252 256 290 166 262Z"/>
    </clipPath>
    <symbol id="tree" viewBox="-12 -30 24 42">
      <path d="M-2 7h4v8h-4z" fill="#102b33"/>
      <path d="M0-29 11-7H5l8 15H-13l8-15h-6Z" fill="#0d5d65" stroke="#58e6df" stroke-width="0.8"/>
      <path d="M0-29v37L-13 8l8-15h-6Z" fill="#173d4b" opacity="0.82"/>
    </symbol>
    <symbol id="rune" viewBox="-18 -18 36 36">
      <path d="M0-15 14 9 0 5-14 9Z" fill="none" stroke="#52ecff" stroke-width="2"/>
      <path d="M0-15v20M-8 6 0-2 8 6" fill="none" stroke="#7777ff" stroke-width="1.7"/>
    </symbol>
  </defs>

  <rect x="48" y="48" width="416" height="416" rx="78" fill="url(#bg)"/>
  <rect x="48" y="48" width="416" height="416" rx="78" fill="url(#ambient)"/>
  <rect x="50" y="50" width="412" height="412" rx="76" fill="none" stroke="#7a9ed5" stroke-opacity="0.22" stroke-width="2"/>

  <g transform="translate(0 -24) translate(256 248) scale(1.075) translate(-256 -248)">
    <!-- Floating world -->
    <g filter="url(#shadow)">
      <path d="M132 223 166 262 256 290 256 382 209 334 166 300Z" fill="url(#leftRock)" stroke="#1bc9ff" stroke-width="1.9"/>
      <path d="M256 290 341 252 382 211 376 292 329 337 256 382Z" fill="url(#rightRock)" stroke="#1bc9ff" stroke-width="1.9"/>

      <g fill="none" stroke="#178bd4" stroke-width="1.1" stroke-opacity="0.56">
        <path d="M132 223 212 269 166 300 209 334 256 290 256 382"/>
        <path d="M341 252 329 337 294 302 256 382"/>
        <path d="M166 262 209 334 229 285 256 290"/>
        <path d="M382 211 337 275 376 292M337 275 294 302"/>
      </g>
      <g fill="#18d7ff" opacity="0.42" filter="url(#glow)">
        <path d="m212 333 11-43 7-4-8 53z"/>
        <path d="m256 382 7-76 7 12-4 54z"/>
        <path d="m329 337 8-62 8-8-9 67z"/>
      </g>

      <path d="M132 223 206 181 254 139 300 165 382 211 341 252 256 290 166 262Z" fill="url(#terrain)" stroke="#8afff3" stroke-width="2.5"/>

      <g clip-path="url(#terrainClip)" fill="none" stroke="#67def5" stroke-opacity="0.22" stroke-width="0.9">
        <path d="M137 237 309 143M151 252 328 156M171 269 346 171M198 285 363 187"/>
        <path d="M153 188 224 291M188 164 254 290M225 143 285 277M269 141 325 256M310 160 360 232"/>
      </g>

      <!-- river source hidden behind ridge -->
      <g clip-path="url(#terrainClip)">
        <path d="M308 178C296 184 295 192 301 199C306 204 303 210 294 216" fill="none" stroke="url(#riverShadow)" stroke-width="13" stroke-linecap="round" opacity="0.44"/>
        <path d="M308 178C296 184 295 192 301 199C306 204 303 210 294 216" fill="none" stroke="url(#river)" stroke-width="7" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
      </g>

      <g stroke="#7cefff" stroke-width="1.3" stroke-linejoin="round">
        <path d="M187 216 246 112 284 210Z" fill="url(#mountainLight)"/>
        <path d="M246 112 300 210 284 210Z" fill="url(#mountainDark)"/>
        <path d="M205 238 231 175 258 230Z" fill="#38597b"/>
        <path d="M231 175 269 225 258 230Z" fill="#1b3f70"/>
        <path d="M273 223 305 160 333 225Z" fill="#3b9fd0"/>
        <path d="M305 160 343 225 333 225Z" fill="#08539c"/>
        <path d="M168 234 191 188 213 235Z" fill="#627f88"/>
        <path d="M191 188 225 236 213 235Z" fill="#234c71"/>
      </g>

      <!-- main river, smoother and better integrated -->
      <g clip-path="url(#terrainClip)">
        <path d="M294 216C309 221 311 229 300 235C289 241 276 246 269 254C262 262 260 274 257 289" fill="none" stroke="url(#riverShadow)" stroke-width="15" stroke-linecap="round" opacity="0.52"/>
        <path d="M294 216C309 221 311 229 300 235C289 241 276 246 269 254C262 262 260 274 257 289" fill="none" stroke="url(#river)" stroke-width="8.8" stroke-linecap="round" filter="url(#glow)"/>
        <path d="M294 216C309 221 311 229 300 235C289 241 276 246 269 254C262 262 260 274 257 289" fill="none" stroke="#d3ffff" stroke-width="1" stroke-linecap="round" opacity="0.58"/>
      </g>

      <!-- waterfall -->
      <path d="M257 288v57" stroke="url(#riverShadow)" stroke-width="14" stroke-linecap="round" opacity="0.42"/>
      <path d="M257 288v57" stroke="url(#river)" stroke-width="8.8" stroke-linecap="round" filter="url(#glow)"/>

      <!-- trees -->
      <g filter="url(#glow)">
        <use href="#tree" x="153" y="207" width="24" height="42"/>
        <use href="#tree" x="180" y="222" width="22" height="38"/>
        <use href="#tree" x="304" y="221" width="22" height="38"/>
        <use href="#tree" x="326" y="194" width="24" height="42"/>
      </g>
    </g>

  </g>

  <!-- energy tether -->
  <path d="M256 326V370" stroke="#5defff" stroke-opacity="0.65" stroke-width="1.8" filter="url(#glow)"/>

  <!-- refined sigil -->
  <g transform="translate(256 380)">
    <ellipse rx="138" ry="54" fill="none" stroke="#113ea6" stroke-opacity="0.45" stroke-width="1.5"/>
    <ellipse rx="114" ry="45" fill="none" stroke="#2ad2ff" stroke-width="2.6" stroke-dasharray="38 16" stroke-linecap="round"/>
    <ellipse rx="76" ry="29" fill="none" stroke="#30e8ff" stroke-width="2.1" stroke-dasharray="5 9" stroke-linecap="round"/>
    <ellipse rx="47" ry="18" fill="none" stroke="#79f4ff" stroke-width="2.1"/>

    <g fill="none" stroke="#48dfff" stroke-opacity="0.48" stroke-width="1.2" stroke-linecap="round">
      <path d="M-126 0H126M0-49V49"/>
      <path d="M-92-36 92 36M-92 36 92-36"/>
    </g>

    <g filter="url(#glow)">
      <use href="#rune" x="-111" y="-18" width="34" height="34"/>
      <use href="#rune" x="77" y="-18" width="34" height="34" transform="rotate(180 94 0)"/>
      <use href="#rune" x="-17" y="17" width="34" height="34" transform="rotate(-90 0 34)"/>
    </g>

    <ellipse rx="39" ry="14.5" fill="url(#core)" filter="url(#softGlow)"/>
    <ellipse rx="16" ry="6" fill="#d2ffff" opacity="0.98"/>
  </g>
</svg>
