<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071116">
  <meta name="description" content="WebGL2 한국형 오픈월드 보행 데모와 이식 가능한 홀로그램 상태창 에셋">
  <title>K-HOLO STATUS // 서울 재난대응구역</title>
  <style>:root{color-scheme:dark;--cyan:#55e7ff;--cyan-rgb:85,231,255;--ink:#061116;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:#071016;color:#eefcff}
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden}body{background:#071016}button,input{font:inherit}button{color:inherit}
#app{position:relative;isolation:isolate;background:#6d8694}.sky{position:absolute;inset:0;z-index:-3;overflow:hidden;background:linear-gradient(#728d9e 0%,#9eabb0 45%,#d1b69c 74%,#8b8482 100%)}.sun{position:absolute;left:67%;top:15%;width:86px;height:86px;border-radius:50%;background:rgba(255,229,181,.92);box-shadow:0 0 38px 18px rgba(255,218,162,.35),0 0 110px 45px rgba(255,211,151,.2)}.cloud{position:absolute;height:48px;border-radius:50%;background:rgba(224,231,232,.28);filter:blur(14px)}.cloud-a{left:8%;top:14%;width:330px;transform:rotate(-4deg)}.cloud-b{right:12%;top:28%;width:240px;opacity:.48}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:crosshair;touch-action:none}.grade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(4,12,17,.08),transparent 52%,rgba(2,7,10,.24)),radial-gradient(circle at 50% 46%,transparent 48%,rgba(0,0,0,.3) 100%);mix-blend-mode:multiply}.grade::after{content:"";position:absolute;inset:0;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.025) 2px 3px)}
.brand{position:absolute;z-index:10;left:24px;top:22px;display:flex;align-items:center;gap:12px;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.7)}.brand-mark{position:relative;width:38px;height:38px;border:1px solid rgba(var(--cyan-rgb),.55);clip-path:polygon(15% 0,100% 0,100% 85%,85% 100%,0 100%,0 15%);background:rgba(2,16,21,.42);box-shadow:inset 0 0 16px rgba(var(--cyan-rgb),.12)}.brand-mark::before,.brand-mark::after,.brand-mark i{content:"";position:absolute;border:1px solid var(--cyan);transform:rotate(45deg)}.brand-mark::before{inset:10px}.brand-mark::after{inset:15px;background:rgba(var(--cyan-rgb),.3)}.brand-mark i{inset:5px;border-color:rgba(var(--cyan-rgb),.2)}.brand strong,.brand small{display:block}.brand strong{font-size:12px;letter-spacing:.15em}.brand small{margin-top:3px;color:rgba(224,248,252,.58);font:8px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.09em}
.mission-chip{position:absolute;z-index:10;left:24px;top:82px;display:grid;grid-template-columns:34px minmax(170px,1fr) auto;gap:10px;align-items:center;width:min(360px,40vw);padding:10px 12px;border-left:2px solid var(--cyan);background:linear-gradient(90deg,rgba(3,15,20,.83),rgba(3,15,20,.28) 80%,transparent);clip-path:polygon(0 0,96% 0,100% 28%,100% 100%,0 100%);text-shadow:0 2px 8px #000}.mission-symbol{width:26px;height:26px;border:1px solid rgba(var(--cyan-rgb),.45);transform:rotate(45deg);position:relative}.mission-symbol::after{content:"";position:absolute;inset:7px;border:1px solid var(--cyan);background:rgba(var(--cyan-rgb),.12)}.mission-copy small,.mission-copy strong,.mission-copy em{display:block}.mission-copy small{color:rgba(202,239,246,.54);font-size:8px;letter-spacing:.07em}.mission-copy strong{margin-top:3px;font-size:12px}.mission-copy em{margin-top:2px;color:rgba(225,248,251,.55);font-size:9px;font-style:normal}.mission-chip>b{color:var(--cyan);font:700 14px ui-monospace,Consolas,monospace}.mission-chip.complete{border-color:#78f2b6}.mission-chip.complete>b{color:#78f2b6}
.crosshair{position:absolute;z-index:8;left:50%;top:50%;width:19px;height:19px;transform:translate(-50%,-50%);opacity:.46;pointer-events:none}.crosshair::before,.crosshair::after{content:"";position:absolute;background:#eefeff;box-shadow:0 0 6px rgba(var(--cyan-rgb),.5)}.crosshair::before{left:9px;top:0;width:1px;height:19px}.crosshair::after{left:0;top:9px;width:19px;height:1px}.crosshair i{position:absolute;inset:6px;border:1px solid rgba(238,254,255,.85);transform:rotate(45deg)}
.telemetry{position:absolute;z-index:10;right:22px;bottom:20px;display:flex;gap:6px;pointer-events:none}.telemetry span{padding:5px 7px;border:1px solid rgba(var(--cyan-rgb),.16);background:rgba(2,11,15,.55);color:rgba(223,248,252,.65);font:8px ui-monospace,Consolas,monospace;box-shadow:0 3px 15px rgba(0,0,0,.2)}
.onboarding{position:absolute;z-index:9;left:50%;top:68%;width:min(680px,88vw);transform:translate(-50%,-50%);padding:18px 24px;text-align:center;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(3,14,18,.58) 15% 85%,transparent);border-top:1px solid rgba(var(--cyan-rgb),.24);border-bottom:1px solid rgba(var(--cyan-rgb),.1);text-shadow:0 2px 10px #000;transition:opacity .45s,transform .45s}.onboarding.quiet{opacity:0;transform:translate(-50%,-44%)}.onboarding small{color:#79ecff;font:9px ui-monospace,Consolas,monospace;letter-spacing:.14em}.onboarding h1{margin:6px 0 7px;font-size:clamp(23px,3vw,38px);letter-spacing:-.045em}.onboarding p{margin:0;color:rgba(231,249,252,.67);font-size:11px;line-height:1.7}.onboarding div{margin-top:11px;color:rgba(230,249,252,.62);font-size:9px}.onboarding kbd,.demo-actions kbd{padding:2px 5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);font:8px ui-monospace,monospace}
.demo-actions{position:absolute;z-index:15;left:50%;bottom:17px;display:flex;gap:6px;transform:translateX(-50%)}.demo-actions button{height:34px;padding:0 12px;border:1px solid rgba(var(--cyan-rgb),.2);background:rgba(2,13,18,.68);font-size:9px;letter-spacing:.03em;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.22);transition:.16s}.demo-actions button:hover,.demo-actions button:focus-visible{outline:none;border-color:rgba(var(--cyan-rgb),.72);background:rgba(25,79,91,.38)}.demo-actions .primary{background:rgba(var(--cyan-rgb),.82);border-color:#a3f3ff;color:#041216;font-weight:800}.demo-actions .danger{border-color:rgba(255,81,72,.48)}.demo-actions .special{border-color:rgba(185,112,255,.48)}
.settings{position:absolute;z-index:60;right:20px;top:20px;width:min(330px,calc(100vw - 40px));padding:14px;border:1px solid rgba(var(--cyan-rgb),.26);background:rgba(3,14,19,.94);box-shadow:0 24px 90px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-8px);transition:.2s}.settings.open{opacity:1;visibility:visible;transform:none}.settings header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(var(--cyan-rgb),.13)}.settings header strong{font-size:12px}.settings header button{width:28px;height:28px;border:1px solid rgba(255,255,255,.1);background:none;cursor:pointer}.settings label{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.055);font-size:10px}.settings label small{display:block;margin-top:3px;color:rgba(222,247,251,.45);font-size:8px}.settings input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--cyan)}.settings input[type=checkbox]{width:34px;height:18px;accent-color:var(--cyan)}.settings>button{width:100%;height:34px;margin-top:12px;border:1px solid rgba(var(--cyan-rgb),.2);background:rgba(var(--cyan-rgb),.07);cursor:pointer;font-size:9px}
.mobile-pad{display:none}.mobile-pad button{border:1px solid rgba(var(--cyan-rgb),.24);background:rgba(2,13,18,.55)}
body[data-flash=danger] .grade{background:radial-gradient(circle at 68% 46%,rgba(255,43,39,.17),transparent 42%),linear-gradient(180deg,rgba(4,12,17,.08),transparent 52%,rgba(2,7,10,.24))}body[data-flash=quest] .grade{background:radial-gradient(circle at 68% 46%,rgba(255,171,45,.14),transparent 42%),linear-gradient(180deg,rgba(4,12,17,.08),transparent 52%,rgba(2,7,10,.24))}body[data-flash=event] .grade{background:radial-gradient(circle at 68% 46%,rgba(176,91,255,.17),transparent 42%),linear-gradient(180deg,rgba(4,12,17,.08),transparent 52%,rgba(2,7,10,.24))}
html[data-reduced-motion=true] *,html[data-reduced-motion=true] *::before,html[data-reduced-motion=true] *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
@media(max-width:850px){.brand{left:14px;top:14px}.mission-chip{left:14px;top:66px;width:min(340px,52vw)}.demo-actions{bottom:10px}.telemetry{right:12px;bottom:54px}.onboarding{top:63%}}
@media(max-width:680px){.brand small{display:none}.mission-chip{width:calc(100vw - 28px);max-width:370px}.mission-copy em{display:none}.onboarding{top:55%;padding:13px}.onboarding h1{font-size:22px}.onboarding p{font-size:10px}.onboarding div{display:none}.telemetry{display:none}.demo-actions{left:8px;right:8px;transform:none;display:grid;grid-template-columns:1.2fr repeat(4,1fr)}.demo-actions button{padding:0 4px}.demo-actions kbd{display:none}.mobile-pad{position:absolute;z-index:14;left:12px;bottom:56px;display:grid;grid-template-columns:repeat(3,34px);grid-template-areas:". f ." "l b r";gap:4px}.mobile-pad button{width:34px;height:34px}.mobile-pad [data-move=forward]{grid-area:f}.mobile-pad [data-move=left]{grid-area:l}.mobile-pad [data-move=back]{grid-area:b}.mobile-pad [data-move=right]{grid-area:r}}
.webgl-failed #world{display:none}.webgl-failed .onboarding{opacity:1!important;transform:translate(-50%,-50%)!important;border-color:rgba(255,90,80,.45)}
</style>
</head>
<body>
  <main id="app">
    <div class="sky" aria-hidden="true"><i class="sun"></i><i class="cloud cloud-a"></i><i class="cloud cloud-b"></i></div>
    <canvas id="world" aria-label="서울형 미래 재난대응구역 WebGL 보행 데모"></canvas>
    <div class="grade" aria-hidden="true"></div>

    <header class="brand" aria-label="프로젝트 식별">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span><strong>K-HOLO STATUS</strong><small>SEOUL RESILIENCE NETWORK // WEBGL FIELD TEST</small></span>
    </header>

    <section class="mission-chip" id="mission-chip" aria-live="polite">
      <span class="mission-symbol" aria-hidden="true"></span>
      <span class="mission-copy"><small id="district-label">서울 북악 재난대응구역</small><strong id="objective-label">도시안전센터 접속</strong><em id="objective-detail">푸른 표식까지 도보 이동</em></span>
      <b id="objective-distance">86m</b>
    </section>

    <div class="crosshair" aria-hidden="true"><i></i></div>

    <aside class="telemetry" id="telemetry" aria-label="개발자 텔레메트리">
      <span id="fps-readout">-- FPS</span><span id="speed-readout">0.0 m/s</span><span id="position-readout">0, 18</span><span>WEBGL2</span>
    </aside>

    <section class="onboarding" id="onboarding">
      <small>GROUND TRAVERSAL / 실제 3D 공간</small>
      <h1>서울 재난대응구역 현장 접속</h1>
      <p>도로를 따라 도시안전센터로 이동하십시오. 건물과 시설물에는 충돌 판정이 적용됩니다.</p>
      <div><kbd>WASD</kbd> 이동 <kbd>SHIFT</kbd> 달리기 <kbd>마우스</kbd> 시점 <kbd>H</kbd> 상태창 <kbd>TAB</kbd> 확장</div>
    </section>

    <nav class="demo-actions" aria-label="상태창 기능 시연">
      <button class="primary" id="toggle-panel">상태창 <kbd>H</kbd></button>
      <button id="quest-event">임무</button>
      <button class="danger" id="danger-event">위험</button>
      <button class="special" id="special-event">특수</button>
      <button id="settings-button" aria-expanded="false">설정</button>
    </nav>

    <section class="settings" id="settings" aria-hidden="true">
      <header><strong>표시 및 접근성</strong><button id="settings-close" aria-label="설정 닫기">×</button></header>
      <label><span>상태창 크기<small>게임별 안전영역에 맞춰 조절</small></span><output id="scale-output">100%</output><input id="ui-scale" type="range" min="0.78" max="1.18" step="0.02" value="1"></label>
      <label><span>모션 최소화<small>홀로그램 전개와 알림 이동 감소</small></span><input id="reduce-motion" type="checkbox"></label>
      <label><span>개발자 텔레메트리<small>FPS, 속도, 월드 좌표 표시</small></span><input id="telemetry-toggle" type="checkbox" checked></label>
      <button id="reset-demo">시작 지점으로 초기화</button>
    </section>

    <div class="mobile-pad" aria-label="모바일 이동 패드">
      <button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button>
    </div>

    <k-holo-status id="holo-status"></k-holo-status>
  </main>

  <script>(function(global){
  'use strict';
  const THEMES={
    info:{label:'정보',rgb:'78,226,255',hex:'#4ee2ff',icon:'shield'},
    quest:{label:'임무',rgb:'255,174,54',hex:'#ffae36',icon:'quest'},
    danger:{label:'위험',rgb:'255,78,70',hex:'#ff4e46',icon:'alert'},
    event:{label:'특수',rgb:'180,105,255',hex:'#b469ff',icon:'event'}
  };
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const icon=(name,size=18)=>{
    const p={
      shield:'M12 2.6 19 5.4v5.2c0 4.7-2.8 8.2-7 10.4-4.2-2.2-7-5.7-7-10.4V5.4L12 2.6Z M12 6v10.8',
      quest:'M12 3.2 20.8 12 12 20.8 3.2 12 12 3.2Z M12 8v4.8 M12 16.2h.01',
      alert:'M12 3.2 21 19H3L12 3.2Z M12 8.4v5.2 M12 16.8h.01',
      event:'M12 3c4.8 0 8 3.1 8 7.1 0 4.8-4 8.8-9 8.8-3.9 0-7-2.2-7-5.8 0-3.1 2.4-5.5 5.4-5.5 2.6 0 4.8 1.7 4.8 4.1 0 2-1.6 3.5-3.6 3.5-1.6 0-2.9-.9-2.9-2.3',
      close:'M5 5l14 14M19 5 5 19',expand:'M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5',
      signal:'M4 18h2v2H4zM8 14h2v6H8zM12 10h2v10h-2zM16 6h2v14h-2z',
      check:'M4 12.5 9.2 18 20 6',target:'M12 3v3M12 18v3M3 12h3M18 12h3 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z',
      data:'M4 7c0-2 3.6-3.5 8-3.5S20 5 20 7s-3.6 3.5-8 3.5S4 9 4 7Zm0 0v5c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5V7m-16 5v5c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-5',
      kit:'M5 7h14v12H5zM9 7V4h6v3M12 10v6M9 13h6',credit:'M4 8h16v10H4zM7 8V5h10v3M8 13h8'
    };
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><path d="${p[name]||p.shield}"/></svg>`;
  };

  class HoloStore{
    constructor(initial={}){this.state=structuredClone(initial);this.listeners=new Set()}
    getState(){return this.state}
    set(next,meta={}){this.state=structuredClone(next);this.emit(meta)}
    patch(partial,meta={}){this.state=merge(this.state,partial);this.emit(meta)}
    subscribe(fn){this.listeners.add(fn);fn(this.state,{source:'subscribe'});return()=>this.listeners.delete(fn)}
    emit(meta){for(const fn of this.listeners)fn(this.state,meta)}
  }
  function merge(a,b){if(!b||typeof b!=='object'||Array.isArray(b))return structuredClone(b);const o={...(a||{})};for(const k of Object.keys(b)){const v=b[k];o[k]=v&&typeof v==='object'&&!Array.isArray(v)?merge(o[k],v):structuredClone(v)}return o}

  const CSS=`
  :host{--holo-scale:1;position:fixed;z-index:40;right:clamp(24px,5vw,76px);top:clamp(118px,16vh,180px);display:block;width:min(470px,47vw);pointer-events:none;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color:#eafcff;filter:drop-shadow(0 22px 36px rgba(0,0,0,.32));transform-origin:100% 35%;transform:perspective(1100px) rotateY(-5deg) scale(var(--holo-scale));transition:transform .26s,opacity .25s}
  :host([data-mode=expanded]){width:min(590px,58vw)}:host([data-mode=compact]){width:min(350px,40vw)}:host([data-open=false]){opacity:0;transform:perspective(1100px) translateX(42px) rotateY(-8deg) scale(calc(var(--holo-scale)*.96));visibility:hidden}.root{--rgb:78,226,255;--accent:#4ee2ff;pointer-events:none}.panel{position:relative;pointer-events:auto;overflow:hidden;border:1px solid rgba(var(--rgb),.72);background:linear-gradient(135deg,rgba(var(--rgb),.09),transparent 26%),linear-gradient(180deg,rgba(4,19,25,.91),rgba(2,11,16,.88));clip-path:polygon(20px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 20px),calc(100% - 20px) 100%,12px 100%,0 calc(100% - 12px),0 20px);box-shadow:inset 0 0 38px rgba(var(--rgb),.06),0 0 0 1px rgba(var(--rgb),.12),0 0 30px rgba(var(--rgb),.12)}
  .panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(var(--rgb),.025) 3px 4px),linear-gradient(90deg,transparent,rgba(var(--rgb),.05),transparent);mix-blend-mode:screen}.panel::after{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 15px var(--accent)}
  svg{fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.head{position:relative;display:grid;grid-template-columns:42px 1fr auto auto auto;gap:8px;align-items:center;padding:15px 16px 12px;border-bottom:1px solid rgba(var(--rgb),.22)}.crest{width:38px;height:38px;display:grid;place-items:center;color:var(--accent);border:1px solid rgba(var(--rgb),.45);background:rgba(var(--rgb),.08);clip-path:polygon(15% 0,100% 0,100% 85%,85% 100%,0 100%,0 15%)}.title strong,.title small{display:block}.title strong{font-size:14px;letter-spacing:.02em}.title small{margin-top:3px;color:rgba(218,245,250,.53);font:8px ui-monospace,monospace;letter-spacing:.09em}.category{display:flex;align-items:center;gap:6px;color:var(--accent);font:8px ui-monospace,monospace;letter-spacing:.08em}.head button,.tabs button,.notice button{display:grid;place-items:center;border:1px solid rgba(var(--rgb),.18);background:rgba(var(--rgb),.035);color:rgba(225,250,253,.64);cursor:pointer}.head button{width:30px;height:30px}.head button:hover,.tabs button:hover{color:#fff;border-color:rgba(var(--rgb),.64);background:rgba(var(--rgb),.11)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 13px;border-bottom:1px solid rgba(var(--rgb),.13)}.tabs button{height:31px;grid-template-columns:auto auto;gap:5px;font-size:8px}.tabs button.active{color:var(--accent);border-color:rgba(var(--rgb),.52);background:rgba(var(--rgb),.1)}
  .body{display:grid;grid-template-columns:1.35fr .82fr;gap:10px;padding:11px 13px 13px}.module{position:relative;border:1px solid rgba(var(--rgb),.15);background:rgba(0,7,11,.22)}.module-title{display:flex;justify-content:space-between;padding:8px 9px 6px;color:var(--accent);font:8px ui-monospace,monospace;letter-spacing:.08em;border-bottom:1px solid rgba(var(--rgb),.1)}.module-title small{color:rgba(222,247,250,.38)}
