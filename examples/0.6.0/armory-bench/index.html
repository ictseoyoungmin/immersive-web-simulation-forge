<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARMORY BENCH — 모듈식 무기 커스터마이징</title>
<meta name="description" content="MK-VII 〈REVENANT〉 정비 스테이션. 모듈을 조합·해제하고 질량 특성과 체결 제약을 즉시 확인한다.">
<link rel="stylesheet" href="src/ui/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230a0e11'/%3E%3Cpath d='M3 12h18M7 9v6M17 9v6' stroke='%234fd6e8' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" data-loading="true">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.42"/>
        <path d="M5 16h22M9 12.4v7.2M23 12.4v7.2M16 7.5v17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="16" cy="16" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <div class="brand-text">
        <strong>ARMORY BENCH</strong>
        <span>MK-VII 〈REVENANT〉 · 정비 스테이션</span>
      </div>
    </div>

    <div class="docbar">
      <label class="visually-hidden" for="doc-name">구성 이름</label>
      <input id="doc-name" type="text" spellcheck="false" autocomplete="off" maxlength="40">
      <span id="doc-state" class="doc-state" data-dirty="false">저장됨</span>
    </div>

    <div class="actions" id="actions"></div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left" id="rack" aria-label="모듈 랙">
      <div class="panel-scroll" id="rack-body"></div>
    </aside>

    <section class="viewport" id="viewport">
      <canvas id="scene" aria-label="3D 무기 뷰어"></canvas>
      <svg id="overlay" class="overlay" aria-hidden="true"></svg>

      <div class="viewport-status" id="viewport-status" role="status"></div>

      <div class="viewport-hint" id="viewport-hint">
        <span>좌 드래그 회전</span><span>휠 확대</span><span>Shift+드래그 이동</span><span>부품 클릭 선택</span>
      </div>

      <div class="viewtools" id="viewtools" role="toolbar" aria-label="뷰 제어"></div>

      <div class="readout" id="readout" aria-live="polite"></div>

      <div class="toasts" id="toasts" aria-live="assertive"></div>
    </section>

    <aside class="panel panel-right" id="inspector" aria-label="상세 정보">
      <div class="panel-scroll" id="inspector-body"></div>
    </aside>
  </main>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-bar"><i></i></div>
      <p>작업대 초기화 중 — 절차적 형상 생성</p>
    </div>
  </div>

  <input type="file" id="import-input" accept=".json,application/json" class="visually-hidden">
</div>

<script type="module" src="src/main.mjs"></script>
<noscript>
  <p style="color:#c3ced5;font-family:system-ui;padding:24px">
    이 작업대는 WebGL과 JavaScript 모듈을 사용한다. 브라우저에서 스크립트를 허용해야 한다.
  </p>
</noscript>
</body>
</html>
